<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rail Wiring Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        linear-gradient(135deg, #101827, #1d2940);
      color: white;
    }

    #app {
      max-width: 760px;
      margin: auto;
    }

    .card {
      padding: 26px;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
    }

    .subtitle {
      color: #aebbd0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input,
    select {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(0,0,0,.25);
      color: white;
      font-size: 1rem;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #75aaff;
      color: #07111f;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #status {
      margin-top: 20px;
    }

    #wiringResults {
      margin-top: 20px;
    }

    .result {
      margin-top: 8px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      font-family: monospace;
    }

    .exact {
      border-left: 4px solid #6ee7a0;
    }

    .near {
      border-left: 4px solid #75aaff;
    }

    .far {
      border-left: 4px solid #ffd166;
    }

    .error {
      padding: 15px;
      border-radius: 10px;
      background: #3b2028;
      color: #ffb4b4;
    }
  </style>
</head>

<body>

  <div id="app">
    <div class="card">
      <h1>Rail Wiring Calculator</h1>
      <p class="subtitle">
        羽あり・地上レール専用
      </p>

      <label>
        目標遅延フレーム
        <input
          id="inputDelay"
          type="number"
          value="30"
          min="0"
          step="1"
        >
      </label>

      <label>
        音符の高さ
        <input
          id="inputHeight"
          type="number"
          value="10"
          min="0"
          step="1"
        >
      </label>

      <label>
        着線パターン
        <select id="landingSelect">
          <option value="1v">1v</option>
          <option value="1d">1d</option>
          <option value="2a">2a</option>
          <option value="2b">2b</option>
          <option value="3">3</option>
          <option value="4a">4a</option>
          <option value="4b">4b</option>
        </select>
      </label>

      <button id="buttonSimpleFind">
        配線候補を検索
      </button>

      <div id="status"></div>
      <div id="wiringResults"></div>
    </div>
  </div>

  <!-- 読み込み順が重要！ -->
  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
