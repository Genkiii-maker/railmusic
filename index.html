<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rail Wiring Generator</title>

<style>
:root {
  --bg: #0e1118;
  --panel: #181e2b;
  --panel2: #222a3b;
  --border: #354057;
  --text: #f4f7ff;
  --sub: #9daac0;
  --accent: #8494ff;
  --accent2: #b56cff;
  --perfect: #69e6a7;
  --near: #a9d8ff;
  --far: #ffd477;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--text);
  font-family: system-ui, sans-serif;
  background:
    radial-gradient(circle at top, #283452, var(--bg) 55%);
}

main {
  width: min(900px, calc(100% - 28px));
  margin: auto;
  padding: 42px 0 70px;
}

header {
  margin-bottom: 25px;
}

header small {
  color: var(--accent);
  font-weight: 800;
  letter-spacing: .12em;
}

h1 {
  font-size: clamp(34px, 8vw, 58px);
  line-height: 1.05;
  margin: 8px 0 12px;
}

h2 {
  margin-top: 0;
}

p {
  color: var(--sub);
  line-height: 1.7;
}

section {
  background: rgba(24, 30, 43, .94);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px;
  margin-top: 18px;
  box-shadow: 0 18px 45px rgba(0,0,0,.2);
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
}

@media (max-width: 650px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

label {
  display: block;
  color: var(--sub);
  font-size: 14px;
  margin-bottom: 7px;
}

input,
select {
  width: 100%;
  padding: 12px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
  font-size: 16px;
}

button {
  margin-top: 16px;
  padding: 13px 20px;
  border: 0;
  border-radius: 11px;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}

.info {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 18px;
}

@media (max-width: 650px) {
  .info {
    grid-template-columns: 1fr;
  }
}

.stat {
  background: var(--panel2);
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 12px;
}

.stat-title {
  color: var(--sub);
  font-size: 13px;
}

.stat-value {
  margin-top: 4px;
  font-size: 24px;
  font-weight: 800;
}

.resultGroup {
  margin-top: 18px;
}

.resultGroup h3 {
  margin-bottom: 8px;
}

.result {
  padding: 11px 14px;
  border-radius: 10px;
  background: var(--panel2);
  border: 1px solid var(--border);
  margin-top: 7px;
  font-family: monospace;
  overflow-wrap: anywhere;
}

.perfect {
  border-color: var(--perfect);
  color: var(--perfect);
}

.near {
  border-color: var(--near);
  color: var(--near);
}

.far {
  border-color: var(--far);
  color: var(--far);
}

.empty {
  color: var(--sub);
  font-family: inherit;
}
</style>
</head>


<body>

<main>

<header>
  <small>RAIL WIRING GENERATOR</small>

  <h1>
    レール配線<br>
    自動検索
  </h1>

  <p>
    TrackConductorの配線探索ロジックを
    wing-ground向けに移植したプロトタイプ。
  </p>
</header>


<section>

<h2>① 条件入力</h2>

<div class="grid">

  <div>
    <label for="delay">
      目標遅延（フレーム）
    </label>

    <input
      id="delay"
      type="number"
      value="170"
      step="1"
    >
  </div>


  <div>
    <label for="height">
      高さ
    </label>

    <input
      id="height"
      type="number"
      value="10"
      min="1"
      step="1"
    >
  </div>


  <div>
    <label for="landing">
      着線方式
    </label>

    <select id="landing">
      <option value="general">general</option>
      <option value="second">second</option>
      <option value="vertical">vertical</option>
      <option value="diagonal">diagonal</option>
    </select>
  </div>

</div>

<button id="searchButton">
  配線を検索
</button>

</section>


<section>

<h2>② 検索結果</h2>

<div class="info">

  <div class="stat">
    <div class="stat-title">◎ 完全一致</div>
    <div class="stat-value" id="perfectCount">0</div>
  </div>

  <div class="stat">
    <div class="stat-title">○ ±1フレーム</div>
    <div class="stat-value" id="nearCount">0</div>
  </div>

  <div class="stat">
    <div class="stat-title">△ ±2フレーム</div>
    <div class="stat-value" id="farCount">0</div>
  </div>

</div>

<div id="results"></div>

</section>

</main>


<script>
"use strict";


/* =====================================================
   しゃもじさんの wing-ground データ
   ===================================================== */

const dataAssets = {

  wing: {

    blockDelays: [10, 11, 11],

    ground: {

      relativeRailDelays: [13, 13, 14],

      landings: [
        { name: "1v", second: 9 },
        { name: "1d", second: 10 },
        { name: "2a", second: 11 },
        { name: "2b", second: 11 },
        { name: "3", second: 11 },
        { name: "4a", second: 10 },
        { name: "4b", second: 10 }
      ],

      accelerationsList: {

        general: [11, 8, 5, 3, 2, 1, 1],

        second: [11, 8, 5, 3, 2, 1],

        vertical: [10, 7, 4, 3, 1, 1, -1],

        diagonal: [10, 7, 4, 2, 1, 0, -1]

      },

      upOptions: [
        { delay: 0, str: "↓", up: 0, offset: 2 },
        { delay: 21, str: "↑R0", up: 0, offset: 1 },
        { delay: 64, str: "↑R1", up: 2, offset: 2 },
        { delay: 82, str: "↑G1R1", up: 3, offset: 0 },
        { delay: 98, str: "↑G2R1", up: 4, offset: 2 },
        { delay: 107, str: "↑R2", up: 4, offset: 0 },
        { delay: 111, str: "↑F", up: 0, offset: 0 },
        { delay: 120, str: "↑G3R1", up: 5, offset: 0 },
        { delay: 124, str: "↑G1R2", up: 5, offset: 0 },
        { delay: 125, str: "↑R1G1R1", up: 5, offset: 1 },
        { delay: 140, str: "↑G2R2", up: 6, offset: 2 },
        { delay: 142, str: "↑R1G2R1", up: 6, offset: 0 },
        { delay: 149, str: "↑R3", up: 6, offset: 1 },
        { delay: 154, str: "↑R1F", up: 2, offset: 1 },
        { delay: 159, str: "↑G1R1G2R1", up: 7, offset: 0 },
        { delay: 159, str: "↑G2R1G1R1", up: 7, offset: 2 },
        { delay: 162, str: "↑G3R2", up: 7, offset: 0 },
        { delay: 163, str: "↑R1G3R1", up: 7, offset: 1 },
        { delay: 167, str: "↑G1R3", up: 7, offset: 0 },
        { delay: 167, str: "↑R1G1R2", up: 5, offset: 1 },
        { delay: 167, str: "↑R2G1R1", up: 5, offset: 2 },
        { delay: 172, str: "↑G1R1F", up: 3, offset: 0 },
        { delay: 175, str: "↑G2R1G2R1", up: 8, offset: 2 },
        { delay: 184, str: "↑R1G2R2", up: 8, offset: 0 },
        { delay: 184, str: "↑R2G2R1", up: 8, offset: 1 },
        { delay: 184, str: "↑G2R3", up: 8, offset: 2 },
        { delay: 188, str: "↑G2R1F", up: 4, offset: 2 },
        { delay: 192, str: "↑R4", up: 8, offset: 2 },
        { delay: 196, str: "↑R2F", up: 4, offset: 2 },
        { delay: 197, str: "↑G3R1G2R1", up: 9, offset: 0 },
        { delay: 197, str: "↑G2R1G3R1", up: 9, offset: 2 },
        { delay: 202, str: "↑G1R2G2R1", up: 9, offset: 0 },
        { delay: 202, str: "↑G2R1G1R2", up: 9, offset: 2 },
        { delay: 205, str: "↑G3R3", up: 9, offset: 0 },
        { delay: 205, str: "↑R1G3R2", up: 9, offset: 1 },
        { delay: 205, str: "↑R2G3R1", up: 9, offset: 2 },
        { delay: 209, str: "↑R2G1R2", up: 9, offset: 2 },
        { delay: 210, str: "↑G3R1F", up: 5, offset: 0 },
        { delay: 210, str: "↑R1G1R3", up: 9, offset: 1 },
        { delay: 214, str: "↑G1R2F", up: 5, offset: 0 },
        { delay: 230, str: "↑G2R2F", up: 6, offset: 2 },
        { delay: 232, str: "↑R1G2R1F", up: 6, offset: 0 },
        { delay: 235, str: "↑R5", up: 10, offset: 0 },
        { delay: 239, str: "↑R3F", up: 6, offset: 0 }
      ],

      gaps: [
        { delay: 5, down: 1, offset: 2 },
        { delay: 9, down: 2, offset: 1 },
        { delay: 11, down: 3, offset: 2 },
        { delay: 13, down: 4, offset: 1 },
        { delay: 14, down: 5, offset: 2 },
        { delay: 15, down: 6, offset: 1 },
        { delay: 16, down: 8, offset: 0 },
        { delay: 16, down: 9, offset: 0 },
        { delay: 16, down: 10, offset: 0 },
        { delay: 16, down: 7, offset: 2 }
      ]

    }

  }

};


/* =====================================================
   DOM
   ===================================================== */

const delayInput =
  document.getElementById("delay");

const heightInput =
  document.getElementById("height");

const landingInput =
  document.getElementById("landing");

const searchButton =
  document.getElementById("searchButton");

const resultsContainer =
  document.getElementById("results");


/* =====================================================
   元ツールの findWiringResults を移植
   ===================================================== */

function findWiringResults(delay, height) {

  const resultsList = [[], [], []];

  const asset =
    dataAssets.wing.ground;

  const {
    relativeRailDelays,
    accelerationsList,
    upOptions,
    gaps
  } = asset;

  const accelerations =
    accelerationsList[landingInput.value];

  const accelerationsLen =
    accelerations.length;


  function getAcceleration(distance) {

    return distance <= accelerationsLen
      ? accelerations[distance - 1]
      : 0;

  }


  const upOptionsLen =
    upOptions.length;

  const gapsLen =
    gaps.length;


  function addDownOption(
    _delay,
    _distance,
    count,
    _str
  ) {

    for (
      let g = 0;
      g < gapsLen;
      g++
    ) {

      const gap =
        gaps[g];

      let dDelay = 0;
      let d = 1;


      for (;;) {

        const distance =
          _distance - (
            gap.down + d * 2
          );

        if (distance <= 0) {

          if (d == 1) return;
          else break;

        }


        dDelay +=
          relativeRailDelays[
            (gap.offset + d - 1) % 3
          ];


        const optionDelay =
          _delay +
          gap.delay +
          dDelay;


        const totalDelay =
          optionDelay -
          getAcceleration(distance);


        const str =
          `${_str}G${gap.down}R${d}`;


        const difference =
          totalDelay - delay;

        const error =
          Math.abs(difference);


        if (error <= 2) {

          resultsList[error].push({

            delay: totalDelay,

            up: startingUp,

            down: height - distance,

            str

          });

          break;

        }


        if (difference > 0) break;


        if (count > 1) {

          addDownOption(
            optionDelay,
            distance,
            count - 1,
            str
          );

        }

      }

    }

  }


  let startingUp;


  for (
    let u = 0;
    u < upOptionsLen;
    u++
  ) {

    const upOption =
      upOptions[u];

    startingUp =
      upOption.up;


    let dDelay = 0;
    let d = 0;


    for (;;) {

      const startingDown =
        d * 2;

      const distance =
        height - startingDown;


      if (distance <= 0) break;


      if (d != 0) {

        dDelay +=
          relativeRailDelays[
            (upOption.offset + d - 1) % 3
          ];

      }


      const startingDelay =
        upOption.delay + dDelay;


      const totalDelay =
        startingDelay -
        getAcceleration(distance);


      const str =
        `${upOption.str}-${(
          d == 0 ? "" : "R" + d
        )}`;


      const difference =
        totalDelay - delay;

      const error =
        Math.abs(difference);


      if (error <= 2) {

        resultsList[error].push({

          delay: totalDelay,

          up: startingUp,

          down: startingDown,

          str

        });

        break;

      }


      if (difference > 0) break;


      addDownOption(
        startingDelay,
        distance,
        3,
        str
      );

    }


    if (d == 0) break;

  }


  return resultsList;

}


/* =====================================================
   結果表示
   ===================================================== */

function renderResults(resultsList, target) {

  resultsContainer.innerHTML = "";

  const names = [
    ["◎ 完全一致", "perfect"],
    ["○ ±1フレーム", "near"],
    ["△ ±2フレーム", "far"]
  ];

  let total = 0;

  resultsList.forEach((results, index) => {

    const group =
      document.createElement("div");

    group.className = "resultGroup";

    const title =
      document.createElement("h3");

    title.textContent =
      names[index][0];

    group.appendChild(title);


    if (!results.length) {

      const empty =
        document.createElement("div");

      empty.className = "result empty";

      empty.textContent =
        "該当する配線はありません。";

      group.appendChild(empty);

    }


    results.forEach(result => {

      total++;

      const div =
        document.createElement("div");

      div.className =
        `result ${names[index][1]}`;

      div.textContent =
        `${result.str} / 実測遅延 ${result.delay}f`
        + ` / ↑${result.up} / ↓${result.down}`
        + ` / 目標との差 ${result.delay - target}f`;

      group.appendChild(div);

    });


    resultsContainer.appendChild(group);

  });

  document.getElementById("perfectCount")
    .textContent = resultsList[0].length;

  document.getElementById("nearCount")
    .textContent = resultsList[1].length;

  document.getElementById("farCount")
    .textContent = resultsList[2].length;

}


searchButton.addEventListener("click", () => {

  const delay =
    Number(delayInput.value);

  const height =
    Number(heightInput.value);


  if (
    !Number.isInteger(delay) ||
    !Number.isInteger(height) ||
    height < 1
  ) {

    alert("遅延と高さを正しく入力してください。");

    return;

  }


  const results =
    findWiringResults(delay, height);

  renderResults(results, delay);

});


searchButton.click();

</script>

</body>
</html>
